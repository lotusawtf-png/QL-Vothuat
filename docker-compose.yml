

services:
  # MySQL Databases
  member-db:
    image: mysql:8.0
    container_name: member-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: member_service_db
    ports:
      - "3306:3306"
    volumes:
      - member-db-volume:/var/lib/mysql
      - ./database/migrations/member-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - gym-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  trainer-db:
    image: mysql:8.0
    container_name: trainer-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: trainer_service_db
    ports:
      - "3307:3306"
    volumes:
      - trainer-db-volume:/var/lib/mysql
      - ./database/migrations/trainer-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - gym-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  attendance-db:
    image: mysql:8.0
    container_name: attendance-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: attendance_service_db
    ports:
      - "3308:3306"
    volumes:
      - attendance-db-volume:/var/lib/mysql
      - ./database/migrations/attendance-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - gym-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  auth-db:
    image: mysql:8.0
    container_name: auth-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_service_db
    ports:
      - "3309:3306"
    volumes:
      - auth-db-volume:/var/lib/mysql
      - ./database/migrations/auth-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - gym-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  payment-db:
    image: mysql:8.0
    container_name: payment-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payment_service_db
    ports:
      - "3310:3306"
    volumes:
      - payment-db-volume:/var/lib/mysql
      - ./database/migrations/payment-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - gym-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  schedule-db:
    image: mysql:8.0
    container_name: schedule-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: schedule_service_db
    ports:
      - "3311:3306"
    volumes:
      - schedule-db-volume:/var/lib/mysql
      - ./database/migrations/schedule-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - gym-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Service Discovery (Eureka)
  discovery-server:
    build:
      context: ./backend/discovery-server
      dockerfile: Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"
    networks:
      - gym-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/eureka"]
      timeout: 10s
      retries: 10

  # API Gateway
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      member-service:
        condition: service_started
      trainer-service:
        condition: service_started
      attendance-service:
        condition: service_started
      auth-service:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
    networks:
      - gym-network
    restart: unless-stopped

  # Microservices
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8084:8084"
    depends_on:
      auth-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-db:3306/auth_service_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
    networks:
      - gym-network
    restart: unless-stopped

  member-service:
    build:
      context: ./backend/member-service
      dockerfile: Dockerfile
    container_name: member-service
    ports:
      - "8081:8081"
    depends_on:
      member-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://member-db:3306/member_service_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
    networks:
      - gym-network
    restart: unless-stopped

  trainer-service:
    build:
      context: ./backend/trainer-service
      dockerfile: Dockerfile
    container_name: trainer-service
    ports:
      - "8082:8082"
    depends_on:
      trainer-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://trainer-db:3306/trainer_service_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
    networks:
      - gym-network
    restart: unless-stopped

  attendance-service:
    build:
      context: ./backend/attendance-service
      dockerfile: Dockerfile
    container_name: attendance-service
    ports:
      - "8083:8083"
    depends_on:
      attendance-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://attendance-db:3306/attendance_service_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
    networks:
      - gym-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gym-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-gateway
    environment:
      REACT_APP_API_URL: http://localhost:8080
    networks:
      - gym-network
    restart: unless-stopped


volumes:
  member-db-volume:
  trainer-db-volume:
  attendance-db-volume:
  auth-db-volume:
  payment-db-volume:
  schedule-db-volume:

networks:
  gym-network:
    driver: bridge
